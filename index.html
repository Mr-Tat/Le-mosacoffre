<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d12">
<title>Mosa'Coffre — V3</title>
<style>
:root{
  --bg:#0f1822;
  --panel:#111820;
  --panel2:#0c1218;
  --steel:#6f7b86;
  --steel-dark:#2d3841;
  --line:#53616d;
  --text:#eef4f8;
  --muted:#aeb9c2;
  --gold:#e4b857;
  --gold2:#9d7226;
  --good:#1f7a48;
  --warn:#b67826;
  --bad:#6e2735;
  --blue:#4da1ff;
  --shadow:0 22px 70px rgba(0,0,0,.52);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at top, rgba(43,66,92,.28), rgba(43,66,92,0) 34%),
    radial-gradient(circle at 20% 18%, rgba(34,60,87,.22), rgba(34,60,87,0) 28%),
    linear-gradient(180deg,#0f1822 0%, #0c1520 46%, #09111a 100%);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}
button,input{font:inherit}
button{touch-action:manipulation}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 10%,rgba(82,126,164,.22),transparent 31%),
    radial-gradient(circle at 85% 0%,rgba(194,143,60,.11),transparent 27%),
    linear-gradient(180deg,#17232d 0%,#111b24 55%,#0e171f 100%);
}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
button:focus-visible,input:focus-visible{outline:3px solid rgba(77,161,255,.8);outline-offset:3px}

.btn{
  border:1px solid #64717c;
  background:linear-gradient(#34404a,#1e272f);
  color:white;
  min-height:44px;
  padding:10px 16px;
  border-radius:11px;
  cursor:pointer;
  font-weight:800;
  letter-spacing:.01em;
  box-shadow:inset 0 1px rgba(255,255,255,.1),0 5px 14px rgba(0,0,0,.28);
  transition:transform .15s ease,filter .15s ease,border-color .15s ease;
}
.btn:hover{filter:brightness(1.09);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{
  background:linear-gradient(#f1c96e,#b4812d);
  border-color:#efc76c;
  color:#1b1409;
  text-shadow:0 1px rgba(255,255,255,.28);
}
.btn.success{background:linear-gradient(#3fbc79,#1f7e4d);border-color:#62d49a}
.btn.warn{background:linear-gradient(#d39a43,#8e5a18);border-color:#dda454}
.btn.danger{background:linear-gradient(#b15a67,#6e2735);border-color:#c6727e}
.btn.ghost{background:rgba(11,16,21,.62);backdrop-filter:blur(6px)}
.btn.small{min-height:38px;padding:8px 12px;font-size:13px}

/* HOME */
.home{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:10px;
}
.home-shell{
  position:relative;
  width:min(1500px,100%);
  min-height:min(88vh,760px);
  border-radius:24px;
  overflow:hidden;
  border:1px solid #56616b;
  background:#10151a;
  box-shadow:0 35px 100px rgba(0,0,0,.68);
}
.home-art{
  position:absolute;inset:0;
  background-image:
    linear-gradient(180deg,rgba(3,7,10,.10),rgba(3,7,10,.26) 58%,rgba(3,7,10,.82) 100%),
    url("home.webp");
  background-size:cover;
  background-position:center;
  filter:saturate(.96) contrast(1.02);
}
.home-top{
  position:relative;z-index:2;
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;padding:10px;
}
.version-badge{
  padding:5px 10px;border-radius:999px;
  background:rgba(8,12,16,.72);
  border:1px solid rgba(229,190,102,.5);
  color:#f2d998;font-size:12px;font-weight:850;letter-spacing:.08em;
  backdrop-filter:blur(7px);
}
.home-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.home-main{
  position:relative;z-index:2;
  min-height:calc(min(92vh,860px) - 150px);
  display:flex;flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  padding:12px 14px 18px;
}
.start-panel{
  width:min(1000px,96%);
  background:linear-gradient(180deg,rgba(7,11,15,.54),rgba(7,11,15,.88));
  border:1px solid rgba(194,205,214,.28);
  border-radius:20px;
  padding:11px;
  box-shadow:0 15px 45px rgba(0,0,0,.32);
  backdrop-filter:blur(8px);
}
.start-row{
  display:grid;
  grid-template-columns:minmax(180px,1fr) auto;
  gap:12px;align-items:end;
}
.start-row-simple{
  grid-template-columns:1fr;
  justify-items:center;
}
.start-row-simple .start-btn{
  width:min(360px,100%);
}
.field label{display:block;color:#dce6ed;font-size:13px;font-weight:800;margin:0 0 6px}
.player-input{
  width:100%;height:50px;border-radius:11px;border:1px solid #687680;
  color:white;background:rgba(9,15,20,.86);padding:0 14px;
  font-size:18px;font-weight:750;
}
.start-btn{min-width:210px;min-height:52px;font-size:18px}
.home-records{
  margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.compact-records{
  max-width:560px;
  margin-left:auto;
  margin-right:auto;
  grid-template-columns:1.35fr .8fr;
  align-items:stretch;
}
.compact-card{padding:8px 11px;text-align:center}
.today-record-card{
  text-align:left;
  padding:10px 15px;
  background:linear-gradient(135deg,rgba(50,66,77,.94),rgba(13,20,26,.9));
  border-color:rgba(232,191,99,.62);
  box-shadow:0 7px 20px rgba(0,0,0,.2);
}
.today-record-card .record-label{font-size:12px;color:#f2d58c}
.today-record-card .record-value{font-size:clamp(24px,4vw,31px);margin-top:1px}
.total-record-card{
  opacity:.88;
  align-self:center;
  padding:7px 10px;
}
.total-record-card .record-label{font-size:10px}
.total-record-card .record-value{font-size:15px;color:#d9c58d}
.record-card{
  min-width:0;
  background:rgba(8,12,16,.78);border:1px solid rgba(113,129,141,.45);
  border-radius:14px;padding:11px 13px;
}
.record-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#aeb9c2;font-weight:850}
.record-value{margin-top:3px;font-size:19px;font-weight:900;color:#ffe3a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record-sub{font-size:12px;color:#aeb9c2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-podium{display:flex;gap:9px;align-items:center;margin-top:5px;font-size:13px;color:#e9eff3;min-width:0}
.mini-podium span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* SETUP */
.setup-wrap{min-height:100vh;padding:12px;display:grid;place-items:center}
.setup-card{
  width:min(940px,100%);border:1px solid #5a6670;border-radius:20px;padding:16px;
  background:
    radial-gradient(circle at 50% -20%,rgba(229,182,83,.16),transparent 45%),
    linear-gradient(180deg,#151c23,#0c1116);
  box-shadow:var(--shadow);
}
.setup-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.setup-title h2{margin:0;font-size:clamp(25px,4vw,38px)}
.setup-title p{margin:5px 0 0;color:var(--muted)}
.section-title{font-weight:900;margin:11px 0 7px;color:#f0d38c;letter-spacing:.02em}
.security-section-title{
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid rgba(122,139,151,.42);
}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.choice{
  position:relative;text-align:left;padding:11px;border-radius:14px;
  border:1px solid #50606b;background:linear-gradient(#1a232c,#10171e);
  color:var(--text);cursor:pointer;min-height:96px;
  transition:.15s ease;
}
.choice:hover{transform:translateY(-2px);border-color:#8998a4}
.choice.selected{
  border-color:#ffe7a8;
  box-shadow:
    0 0 0 4px rgba(255,231,168,.44),
    0 0 30px rgba(255,205,82,.55),
    0 0 60px rgba(255,205,82,.18),
    0 12px 28px rgba(0,0,0,.34);
  filter:brightness(1.14) saturate(1.08);
  transform:translateY(-3px) scale(1.015);
}
.choice.selected::after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:inherit;
  border:2px solid rgba(255,239,193,.68);
  pointer-events:none;
  box-shadow:0 0 18px rgba(255,215,110,.35);
}
#levelChoices .choice[data-level="bronze"]{
  background:linear-gradient(145deg,#805338,#3f2d24);
  border-color:#ad7652;
}
#levelChoices .choice[data-level="silver"]{
  background:linear-gradient(145deg,#8a969f,#3c4851);
  border-color:#b7c2ca;
}
#levelChoices .choice[data-level="gold"]{
  background:linear-gradient(145deg,#9c7624,#493711);
  border-color:#d6ae4e;
}
#levelChoices .choice[data-level="bronze"] .choice-score{color:#ffd0ad}
#levelChoices .choice[data-level="silver"] .choice-score{color:#edf5fa}
#levelChoices .choice[data-level="gold"] .choice-score{color:#ffe29a}
#levelChoices .choice:hover{filter:brightness(1.08)}

#chestChoices .choice{
  min-height:86px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding-bottom:16px;
}
#chestChoices .choice[data-chests="1"]{
  background:linear-gradient(145deg,#244f3a,#163526);
  border-color:#3f7458;
  color:#f3faf6;
}
#chestChoices .choice[data-chests="1"] .choice-name{color:#7fd19a}
#chestChoices .choice[data-chests="1"] .choice-score{color:#b9d9c5}

#chestChoices .choice[data-chests="3"]{
  background:linear-gradient(145deg,#65511e,#403311);
  border-color:#8a7130;
  color:#fff9ea;
}
#chestChoices .choice[data-chests="3"] .choice-name{color:#f0c85d}
#chestChoices .choice[data-chests="3"] .choice-score{color:#e0d2a4}

#chestChoices .choice[data-chests="5"]{
  background:linear-gradient(145deg,#5d2e35,#391b20);
  border-color:#7f4650;
  color:#fff4f5;
}
#chestChoices .choice[data-chests="5"] .choice-name{color:#e7848f}
#chestChoices .choice[data-chests="5"] .choice-score{color:#ddc0c4}

#chestChoices .choice .choice-name{
  font-size:26px;
  line-height:1;
  letter-spacing:.01em;
}
#chestChoices .choice.selected{
  border-color:#ffe7a8;
  box-shadow:
    0 0 0 4px rgba(255,231,168,.46),
    0 0 32px rgba(255,205,82,.58),
    0 0 60px rgba(255,205,82,.18),
    0 12px 28px rgba(0,0,0,.34);
  filter:brightness(1.15) saturate(1.08);
  transform:translateY(-3px) scale(1.015);
}
#chestChoices .choice::after{
  content:"";
  position:absolute;
  left:11px;right:11px;bottom:8px;
  height:4px;border-radius:999px;
  opacity:.9;
}
#chestChoices .choice[data-chests="1"]::after{
  background:linear-gradient(90deg,#4fa66d 0 32%,rgba(79,166,109,.15) 32% 100%);
}
#chestChoices .choice[data-chests="3"]::after{
  background:linear-gradient(90deg,#d2a937 0 64%,rgba(210,169,55,.15) 64% 100%);
}
#chestChoices .choice[data-chests="5"]::after{
  background:#b8515d;
}
.choice-name{font-size:18px;font-weight:950}
.choice-desc{margin-top:3px;color:#b8c3ca;font-size:13px;line-height:1.4}
.choice-score{margin-top:5px;color:#f0ca76;font-weight:850;font-size:13px}
.level-medal{font-size:24px;margin-bottom:2px}
.setup-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:12px}

/* GAME */
.game-screen{height:100vh;overflow:hidden}
.game-shell{
  height:100vh;
  width:min(1020px,100%);
  margin:0 auto;
  position:relative;
  display:grid;
  grid-template-rows:1fr;
  padding:12px;
  gap:10px;
}
.game-topbar{
  position:absolute;
  z-index:30;
  top:12px;
  right:12px;
  width:178px;
  min-height:0;
  display:block;
  background:rgba(12,18,23,.94);
  border:1px solid #485560;
  border-radius:13px;
  padding:7px;
  box-shadow:0 8px 30px rgba(0,0,0,.24);
}
.game-brand{display:flex;align-items:center;gap:10px;min-width:0}
.game-logo{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;font-weight:1000;color:#1b1409;
  background:radial-gradient(circle,#efc96e 0 25%,#a9792a 27% 42%,#313b43 44% 62%,#93a0a9 64% 67%,#222b32 69%);
  border:1px solid #8c98a1;box-shadow:inset 0 0 0 2px #13181c;
}
.game-brand-text{min-width:0}
.game-title{font-weight:950;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-progress{
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:5px;
}
.progress-pill{
  padding:4px 5px;border-radius:999px;border:1px solid #4c5963;
  background:#0b1116;font-size:10px;font-weight:850;color:#dce5eb;
  text-align:center;white-space:nowrap;
}
.progress-pill strong{color:#f1ca74}
.game-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}
.game-actions .btn{
  padding:7px 5px;
  font-size:10px;
  white-space:nowrap;
}

.game-main{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(390px,1fr) 178px;
  grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:
    "board side"
    "dock side";
  column-gap:11px;
  row-gap:6px;
}
.board-stage{
  grid-area:board;
  width:84%;
  justify-self:end;
  box-sizing:border-box;
}
.side-info{
  grid-area:side;
  box-shadow:
    -4px 0 12px rgba(0,0,0,.10),
    0 10px 35px rgba(0,0,0,.22);
}
.control-dock{grid-area:dock}
.control-dock,.side-info{
  min-height:0;
  align-self:stretch;
  border:1px solid #46535e;border-radius:17px;
  background:linear-gradient(180deg,#131b22,#0c1217);
  box-shadow:0 10px 35px rgba(0,0,0,.22);
  overflow:auto;
}
.control-dock{
  width:84%;
  justify-self:end;
  box-sizing:border-box;
  padding:8px 10px 7px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 118px;
  grid-template-areas:
    "symbols validate"
    "bottom bottom";
  gap:6px;
  align-content:start;
  overflow:hidden;
}
.attempt-box{
  border-radius:13px;padding:9px 8px;text-align:center;
  background:linear-gradient(#2c3740,#172028);border:1px solid #5e6c77;
  font-size:15px;color:#bcc6cd;
  min-height:46px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
@media (min-width:761px){
  .attempt-box{display:none}
}

.attempt-label{display:block}
.attempt-box strong{display:block;color:#ffd77d;font-size:23px;line-height:1.05;margin-top:2px}
.symbol-grid{
  display:grid;
  grid-template-columns:repeat(var(--symbol-cols,4),minmax(0,1fr));
  gap:6px;
}
.symbol-select-row{
  grid-area:symbols / symbols / symbols / validate;
  display:grid;
  grid-template-columns:minmax(0,390px) 108px;
  justify-content:center;
  gap:10px;
  align-items:stretch;
}
.dock-bottom{
  grid-area:bottom;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}
.symbol-grid{min-width:0}
.live-points{min-width:0}
.dock-actions{min-width:0}
.dock-help{display:none}
.symbol-btn{
  position:relative;height:70px;border-radius:12px;border:1px solid #4d5a64;
  touch-action:none;
  background:color-mix(in srgb, var(--symbol-color,#78a7d8) 34%, #111920);
  color:color-mix(in srgb, var(--symbol-color,#78a7d8) 72%, white);
  cursor:pointer;font-size:30px;font-weight:900;
  text-shadow:
    0 1px 1px rgba(0,0,0,.75),
    0 0 7px color-mix(in srgb, var(--symbol-color,#78a7d8) 55%, transparent);
  display:grid;place-items:center;
  box-shadow:none;
}
.symbol-btn::after{
  content:"";position:absolute;inset:6px;border-radius:8px;border:1px solid var(--symbol-color,#78a7d8);
  opacity:.48;pointer-events:none;
}
.symbol-btn:hover:not(:disabled){filter:brightness(1.05)}
.symbol-btn.used{opacity:.42;filter:grayscale(.55)}
.symbol-btn.present{
  box-shadow:
    0 0 0 2px color-mix(in srgb, var(--symbol-color,#78a7d8) 72%, #dbe6ec),
    0 0 8px color-mix(in srgb, var(--symbol-color,#78a7d8) 42%, transparent);
}
.symbol-btn.absent{opacity:.48;filter:grayscale(.55)}
.symbol-btn.absent::before{
  content:"";position:absolute;width:76%;height:3px;background:#ef5e64;
  transform:rotate(-35deg);border-radius:999px;z-index:3;box-shadow:0 0 5px rgba(239,94,100,.5)
}
.symbol-btn:disabled{cursor:not-allowed}

.symbol-btn.dragging{
  opacity:.35!important;
  transform:scale(.96);
}
.slot.current-slot{
  cursor:pointer;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
.slot.current-slot.drag-source{
  opacity:.45;
  transform:scale(.96);
}
.slot.current-slot.drop-target{
  outline:3px solid #f0c86d;
  outline-offset:2px;
  box-shadow:0 0 16px rgba(240,200,109,.45)!important;
}
.slot.current-slot{
  border-color:#6f7b84;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 0 0 1px rgba(96,113,124,.16);
}
.slot.current-slot.filled{
  box-shadow:
    inset 0 0 0 5px color-mix(in srgb, var(--symbol-color,#7baada) 32%, #0d141a),
    inset 0 2px 4px rgba(255,255,255,.08),
    0 0 0 2px color-mix(in srgb, var(--symbol-color,#7baada) 42%, transparent),
    0 0 14px color-mix(in srgb, var(--symbol-color,#7baada) 28%, transparent);
}
.slot.current-slot.next-slot{
  border-color:#f0cb74;
  box-shadow:
    inset 0 0 0 1px rgba(255,226,162,.28),
    0 0 0 3px rgba(240,203,116,.25),
    0 0 14px rgba(240,203,116,.24);
  animation:nextSlotPulse 1.2s ease-in-out infinite;
}
@keyframes nextSlotPulse{
  0%,100%{
    box-shadow:
      inset 0 0 0 1px rgba(255,226,162,.22),
      0 0 0 3px rgba(240,203,116,.20),
      0 0 10px rgba(240,203,116,.18);
  }
  50%{
    box-shadow:
      inset 0 0 0 1px rgba(255,236,188,.34),
      0 0 0 4px rgba(240,203,116,.34),
      0 0 18px rgba(240,203,116,.34);
  }
}
.slot.current-slot:hover{
  border-color:#d1ae5b;
}
.slot.drop-target{
  outline:3px solid #f0c86d;
  outline-offset:2px;
  box-shadow:0 0 16px rgba(240,200,109,.45)!important;
}
.drag-ghost{
  position:fixed;
  z-index:9999;
  width:48px;height:48px;
  border-radius:12px;
  display:grid;place-items:center;
  pointer-events:none;
  font-size:27px;font-weight:900;
  color:color-mix(in srgb, var(--symbol-color) 72%, white);
  background:
    linear-gradient(rgba(255,255,255,.08),rgba(0,0,0,.14)),
    color-mix(in srgb, var(--symbol-color) 42%, #101820);
  border:2px solid color-mix(in srgb, var(--symbol-color) 82%, white);
  box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 16px color-mix(in srgb,var(--symbol-color) 42%,transparent);
  transform:translate(-50%,-50%) scale(1.06);
}

.dock-actions{
  display:grid;
  grid-template-columns:repeat(2,150px);
  justify-content:center;
  gap:10px;
}
.dock-actions .btn{
  font-size:12px;
  padding:7px 10px;
  min-height:34px;
  line-height:1.05;
  border-radius:11px;
}

.validate-3d{
  position:relative;
  border:0;
  border-radius:14px;
  min-width:98px;
  min-height:70px;
  padding:0 12px;
  cursor:pointer;
  color:#f5fff8;
  font-weight:950;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.025em;
  background:
    linear-gradient(180deg,#5be090 0%,#35b96f 46%,#1f8a50 100%);
  box-shadow:
    0 7px 0 #145f38,
    0 10px 18px rgba(0,0,0,.38),
    inset 0 2px 0 rgba(255,255,255,.34),
    inset 0 -2px 0 rgba(0,0,0,.16);
  border:2px solid #73e5a3;
  text-shadow:0 2px 2px rgba(0,0,0,.34);
  transform:translateY(-3px);
  transition:transform .08s ease,box-shadow .08s ease,filter .12s ease;
}
.validate-3d::after{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.24);
  pointer-events:none;
}
.validate-3d:hover{filter:brightness(1.08)}
.validate-3d:active{
  transform:translateY(4px);
  box-shadow:
    0 1px 0 #145f38,
    0 4px 8px rgba(0,0,0,.34),
    inset 0 2px 5px rgba(0,0,0,.18);
}
.validate-3d:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.45)}

.dock-help{
  font-size:11px;color:#9eabb4;line-height:1.35;text-align:center;
  align-self:end;margin-top:4px
}

.board-stage{
  min-height:0;
  position:relative;
  border:2px solid #56626c;border-radius:20px;
  background:
    radial-gradient(circle at 50% 48%,rgba(101,118,130,.10),transparent 34%),
    linear-gradient(180deg,rgba(27,36,43,.95),rgba(11,16,21,.98));
  box-shadow:var(--shadow);
  overflow:hidden;
}
.vault-lines{
  position:absolute;inset:0;pointer-events:none;opacity:.72;
  background:
    radial-gradient(circle at 50% 50%,transparent 0 27%,rgba(108,125,138,.30) 27.2% 28%,transparent 28.2% 37%,rgba(86,103,115,.22) 37.2% 38%,transparent 38.2%),
    linear-gradient(90deg,transparent 49.7%,rgba(94,111,124,.15) 50%,transparent 50.3%),
    linear-gradient(transparent 49.7%,rgba(94,111,124,.15) 50%,transparent 50.3%);
}
.corner-lock{
  position:absolute;z-index:5;width:48px;height:55px;
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.45));
  transition:opacity .2s ease;
}
.corner-lock.tl{top:12px;left:12px}
.corner-lock.tr{top:12px;right:12px}
.corner-lock.bl{bottom:12px;left:12px}
.corner-lock.br{bottom:12px;right:12px}
.lock-shackle{
  position:absolute;left:11px;top:0;width:26px;height:28px;
  border:5px solid #aab4ba;border-bottom:0;border-radius:16px 16px 0 0;
  transform-origin:20% 100%;
}
.lock-body{
  position:absolute;left:5px;bottom:0;width:38px;height:35px;border-radius:7px;
  background:linear-gradient(#d4ae56,#8a6120);
  border:2px solid #edcf84;
  box-shadow:inset 0 -8px rgba(75,47,10,.22);
}
.lock-body::after{
  content:"";position:absolute;left:16px;top:9px;width:5px;height:13px;border-radius:3px;
  background:#241b0c;box-shadow:0 0 0 2px rgba(255,255,255,.06)
}
.corner-lock.open .lock-shackle{
  transform:translate(7px,-4px) rotate(38deg);
  transition:transform .32s cubic-bezier(.18,.85,.3,1.25);
}
.corner-lock.open .lock-body{
  filter:brightness(1.18);
  box-shadow:inset 0 -8px rgba(75,47,10,.22),0 0 15px rgba(255,215,122,.45);
}
.corner-lock.unlock-pop{animation:unlockPop .34s ease-out}
.corner-lock.falling{
  animation:lockFall .78s cubic-bezier(.42,.02,.84,.35) forwards;
  pointer-events:none;
}
.corner-lock.gone{opacity:0;visibility:hidden}
@keyframes unlockPop{
  0%{transform:scale(1)}
  55%{transform:scale(1.16);filter:drop-shadow(0 0 14px #ffd97a)}
  100%{transform:scale(1)}
}
@keyframes lockFall{
  0%{opacity:1;translate:0 0;rotate:0deg}
  18%{translate:0 -4px;rotate:-3deg}
  100%{opacity:0;translate:0 260px;rotate:38deg}
}
.board-stage.door-opening{
  box-shadow:0 0 0 2px rgba(238,197,105,.38),0 0 45px rgba(238,197,105,.28),var(--shadow);
}
.board-stage.door-opening .vault-lines,
.board-stage.door-opening .board-scroll{
  transform-origin:left center;
  animation:vaultDoorSwing 1.05s cubic-bezier(.22,.72,.23,1) forwards;
}
@keyframes vaultDoorSwing{
  0%{transform:none;opacity:1}
  100%{transform:none;opacity:1}
}

.board-scroll{
  position:absolute;inset:0;
  overflow-y:auto;overscroll-behavior:contain;
  padding:70px 20px 20px;
  scrollbar-color:#55636e #11181e;
}
.board-head{
  text-align:center;margin:-54px 58px 15px;
  border:1px solid #697783;border-radius:11px;
  background:linear-gradient(#69757f,#3d4851);
  color:#11171c;padding:10px 14px;font-weight:900;
  text-shadow:0 1px rgba(255,255,255,.25);
  box-shadow:inset 0 1px rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.25)
}
.board{display:grid;gap:8px;justify-content:center}
.guess-row{
  display:grid;gap:8px;align-items:center;
  padding:7px 10px;border-radius:13px;
  border:1px solid rgba(84,99,111,.45);
  background:rgba(8,13,17,.68);
  min-width:max-content;
}
.guess-row.current{
  border-color:#e3bb5d;
  background:rgba(13,19,24,.82);
  box-shadow:
    0 0 0 2px rgba(227,187,93,.18),
    0 0 18px rgba(227,187,93,.10);
}
.slot{
  width:52px;height:52px;border-radius:11px;
  display:grid;place-items:center;position:relative;
  overflow:hidden;
  background:linear-gradient(#1c252c,#10161b);
  border:1px solid #53606a;
  font-size:28px;font-weight:900;
  color:color-mix(in srgb, var(--symbol-color,#7baada) 72%, white);
  text-shadow:
    0 2px 3px rgba(0,0,0,.72),
    0 0 6px color-mix(in srgb, var(--symbol-color,#7baada) 48%, transparent);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.2);
}
.slot.filled{
  background:
    linear-gradient(rgba(255,255,255,.07),rgba(0,0,0,.13)),
    color-mix(in srgb, var(--symbol-color,#7baada) 52%, #101820);
  border:2px solid color-mix(in srgb, var(--symbol-color,#7baada) 80%, white);
  box-shadow:
    inset 0 0 0 5px color-mix(in srgb, var(--symbol-color,#7baada) 32%, #0d141a),
    inset 0 2px 4px rgba(255,255,255,.08),
    0 0 7px color-mix(in srgb, var(--symbol-color,#7baada) 24%, transparent);
}
.slot.correct{
  border-color:#4fa97c;
  box-shadow:
    inset 0 0 0 6px var(--good),
    inset 0 0 0 9px rgba(9,14,17,.82),
    0 0 9px rgba(31,122,72,.16);
}
.slot.misplaced{
  border-color:#c89a50;
  box-shadow:
    inset 0 0 0 6px var(--warn),
    inset 0 0 0 9px rgba(9,14,17,.82),
    0 0 9px rgba(182,120,38,.15);
}
.slot.absent{
  border-color:#91505f;
  box-shadow:
    inset 0 0 0 6px var(--bad),
    inset 0 0 0 9px rgba(9,14,17,.82),
    0 0 9px rgba(110,39,53,.13);
}
.row-number{
  width:30px;text-align:center;color:#8897a2;font-size:12px;font-weight:850
}
.guess-row-inner{display:flex;gap:8px;align-items:center}
.board-message{
  text-align:center;margin:13px auto 0;max-width:620px;
  color:#b9c4cb;font-size:13px;min-height:20px
}

.side-info{
  padding:62px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px
}
.side-card{
  border-radius:13px;border:1px solid #46545f;background:rgba(9,14,18,.75);padding:11px
}
.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#96a6b0;font-weight:900}
.side-big{font-size:23px;font-weight:950;color:#ffd479;margin-top:3px}
.side-sub{font-size:12px;color:#a9b5bd;margin-top:2px}
.side-score-separator{
  height:1px;
  margin:10px 0 8px;
  background:rgba(112,129,141,.35);
}
.side-score-total{
  font-size:20px;
  color:#f1ca74;
  margin-top:2px;
}
.legend{display:grid;gap:11px;font-size:13px}
.legend-item{display:flex;gap:9px;align-items:flex-start;line-height:1.25}
.legend-swatch{width:15px;height:15px;border-radius:4px;flex:none;margin-top:1px}
.legend-swatch.good{background:var(--good)} .legend-swatch.warn{background:var(--warn)} .legend-swatch.bad{background:var(--bad)}
.series-icons{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.mini-vault{
  width:29px;height:29px;border-radius:7px;border:1px solid #55636e;
  background:#172027;display:grid;place-items:center;font-size:15px;color:#7c8a94
}
.mini-vault.opened{background:linear-gradient(#d5ad57,#7e571c);color:#171108;border-color:#e8c470}
.mini-vault.failed{background:linear-gradient(#74343a,#3e1d21);color:#f0b1b5;border-color:#965057}

/* MODALS */
.modal-backdrop{
  position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;
  background:rgba(2,5,8,.79);backdrop-filter:blur(5px);
}
.modal-backdrop.show{display:grid}
.modal{
  width:min(720px,96vw);max-height:92vh;overflow:auto;
  border-radius:22px;border:1px solid #63717c;
  background:
    radial-gradient(circle at 50% 0%,rgba(228,184,87,.14),transparent 38%),
    linear-gradient(#182129,#0d1318);
  box-shadow:0 35px 100px rgba(0,0,0,.72);
  padding:20px;
}
.modal h2{margin:0 0 6px;font-size:clamp(25px,5vw,39px)}
.modal p{color:#b8c3ca;line-height:1.45}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:17px}
.rules-list{display:grid;gap:9px;color:#dce4e9;font-size:14px;line-height:1.42}
.rule{padding:10px 12px;border:1px solid #45535e;border-radius:12px;background:#0b1116}
.rule strong{color:#f0cb78}
.leaderboard{display:grid;gap:8px;margin-top:12px}
.leader-row{
  display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;
  padding:10px;border:1px solid #45535e;border-radius:12px;background:#0b1116
}
.leader-rank{font-size:22px;text-align:center}
.leader-name{font-weight:850;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leader-meta{font-size:11px;color:#91a0aa;margin-top:2px}
.leader-score{font-weight:950;color:#ffd678;white-space:nowrap}

/* RESULT / CHEST ANIMATION */
.result-scene{
  text-align:center;
  overflow:hidden;
  padding-bottom:14px;
}
.result-copy{
  position:relative;
  z-index:8;
  margin-bottom:10px;
}
.result-copy h2{margin-bottom:4px}
.result-copy .result-score{margin:2px 0 4px}
.result-vault{margin-top:10px!important;margin-bottom:50px!important}
.result-actions{
  position:relative;
  z-index:8;
  width:min(430px,84vw);
  margin:-6px auto 8px!important;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}
.result-actions .btn{
  min-width:120px;
  padding:11px 16px;
}
.result-vault{
  position:relative;
  width:min(410px,84vw);
  aspect-ratio:1.12/1;
  margin:3px auto 13px;
  border-radius:24px;
  border:7px solid #4c5962;
  background:
    linear-gradient(180deg,#10161b,#090d11);
  box-shadow:
    inset 0 0 0 7px #242d33,
    0 22px 42px rgba(0,0,0,.5),
    18px 16px 0 rgba(16,23,28,.75),
    28px 24px 30px rgba(0,0,0,.28);
  transform:scale(.86);
  animation:vaultIn .45s ease forwards;
  overflow:visible;
  perspective:1000px;
}
@keyframes vaultIn{to{transform:scale(1)}}


.vault-depth{
  position:absolute;
  z-index:0;
  pointer-events:none;
}
.vault-side-left{
  left:-38px;
  top:20px;
  width:42px;
  height:calc(100% - 30px);
  background:linear-gradient(90deg,#091015,#2a363e 58%,#131b20);
  transform:skewY(-28deg);
  border:1px solid #4d5962;
  box-shadow:inset -10px 0 14px rgba(0,0,0,.40);
}
.vault-side-right{
  right:-38px;
  top:20px;
  width:42px;
  height:calc(100% - 30px);
  background:linear-gradient(90deg,#0d151a,#304049 42%,#11181d);
  transform:skewY(28deg);
  border:1px solid #4d5962;
  box-shadow:inset 10px 0 14px rgba(0,0,0,.44);
}
.vault-top{
  left:26px;
  right:26px;
  top:-30px;
  height:34px;
  background:linear-gradient(180deg,#667681,#253139);
  transform:skewX(-24deg);
  border:1px solid #6b7881;
  box-shadow:inset 0 -10px 14px rgba(0,0,0,.30);
}

.final-code-strip{
  position:absolute;
  top:17%;
  left:50%;
  transform:translateX(-50%);
  z-index:7;
  display:flex;
  gap:6px;
  padding:7px 10px;
  border-radius:12px;
  background:linear-gradient(180deg,rgba(8,13,17,.9),rgba(18,25,30,.92));
  border:1px solid #71808a;
  box-shadow:
    inset 0 1px rgba(255,255,255,.08),
    0 5px 14px rgba(0,0,0,.4);
  opacity:0;
  transition:opacity .25s ease;
}
.result-vault.grand-open .final-code-strip,
.result-vault.code-reveal .final-code-strip{
  opacity:1;
}
.result-vault.grand-open .final-code-strip{
  animation:mechanismFadeOut .16s linear 2.88s forwards;
}
@keyframes mechanismFadeOut{
  to{
    opacity:0;
    visibility:hidden;
  }
}
.final-code-chip{
  width:34px;
  height:34px;
  border-radius:8px;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:900;
  color:color-mix(in srgb,var(--symbol-color) 72%,white);
  background:
    linear-gradient(rgba(255,255,255,.06),rgba(0,0,0,.12)),
    color-mix(in srgb,var(--symbol-color) 42%,#101820);
  border:2px solid color-mix(in srgb,var(--symbol-color) 80%,white);
  text-shadow:
    0 1px 2px rgba(0,0,0,.72),
    0 0 5px color-mix(in srgb,var(--symbol-color) 48%,transparent);
}

.final-code-chip.empty{
  color:transparent;
  --symbol-color:#6c7882;
  background:linear-gradient(#111820,#090e12);
  border-color:#697783;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.03);
}
